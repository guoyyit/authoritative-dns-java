# HTTP management API
server.port=18080

# DNS listeners (unprivileged ports for local reproduction)
dns.listen-address=127.0.0.1
dns.udp-port=15353
dns.tcp-port=15353
dns.udp-max-payload=512

# Data directory for zone persistence and audit trail
dns.data-dir=data
dns.zone-file=zone.dat
dns.audit-file=audit.log

# Shared keys (override via environment for real deployments)
dns.update-key=${DNS_UPDATE_KEY:change-me-update-key}
dns.transfer-key=${DNS_TRANSFER_KEY:change-me-transfer-key}
